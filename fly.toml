app = 'antientropy-mcp'
primary_region = 'iad'

[build]

[env]
  CACHE_DIR = "/data"
  TRANSPORT = "streamable-http"
  HOST = "0.0.0.0"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  processes = ['app']
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/healthz"

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  memory = '256MB'
  cpu_kind = 'shared'
  cpus = 1
