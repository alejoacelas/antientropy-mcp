[project]
name = "antientropy-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alejandro Acelas", email = "alejoacelas@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "markdownify>=0.14",
    "mcp>=1.26",
    "pyyaml>=6.0.3",
    "uvicorn>=0.42.0",
]

[project.scripts]
antientropy-sync = "antientropy_mcp.sync:cli_sync"

[build-system]
requires = ["uv_build>=0.10.3"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
